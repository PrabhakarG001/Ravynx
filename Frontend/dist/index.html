      <div id="google_translate_element" style="display:none; position:absolute; z-index:-9999; width:0; height:0;"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'hi,en',
            autoDisplay: false
          }, 'google_translate_element');
        }

        // Proactive DOM observer to eliminate Google Translate banner frames instantly
        (function() {
          function purgeBanner() {
            var frames = document.querySelectorAll('iframe.goog-te-banner-frame, .goog-te-banner-frame, body > .skiptranslate');
            frames.forEach(function(f) {
              f.style.setProperty('display', 'none', 'important');
              f.style.setProperty('visibility', 'hidden', 'important');
              f.style.setProperty('height', '0px', 'important');
            });
            document.body.style.setProperty('top', '0px', 'important');
            document.body.style.setProperty('margin-top', '0px', 'important');
            document.documentElement.style.setProperty('top', '0px', 'important');
            document.documentElement.style.setProperty('margin-top', '0px', 'important');
          }

          var observer = new MutationObserver(purgeBanner);
          observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
          setInterval(purgeBanner, 200);
        })();
      </script>
